evaluator:
  profile: sky130-generic
  circuit: analog-ldo
  analyses: [dc, transient]
  corners: [TT]
  timeout_s: 180
# Example smoke-test limits, not a production specification.
constraints:
  vout_1p4_v: {min: 1.1, max: 1.3}
  vout_1p8_v: {min: 1.1, max: 1.3}
  line_regulation_mv_per_v: {max: 100}
  vout_light_v: {min: 1.1, max: 1.3}
  vout_heavy_v: {min: 1.1, max: 1.3}
  load_regulation_mv: {max: 100}
  droop_mv: {max: 200}
  settling_time_us: {max: 2.8}
  input_current_ua: {max: 200}
